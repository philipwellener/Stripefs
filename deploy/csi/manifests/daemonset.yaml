apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: stripefs-csi-driver
  namespace: kube-system
  labels:
    app: stripefs-csi-driver
spec:
  selector:
    matchLabels:
      app: stripefs-csi-driver
  template:
    metadata:
      labels:
        app: stripefs-csi-driver
    spec:
      serviceAccountName: stripefs-csi-driver
      containers:
        # CSI driver container
        - name: stripefs-csi-driver
          image: stripefs-csi-driver:latest
          imagePullPolicy: Never
          args:
            - "--endpoint=unix:///csi/csi.sock"
            - "--node-id=$(NODE_NAME)"
            - "--v=2"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: pods-mount-dir
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
            - name: data-dir
              mountPath: /data
            - name: dev-fuse
              mountPath: /dev/fuse

        # node-driver-registrar sidecar
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.10.0
          args:
            - "--csi-address=/csi/csi.sock"
            - "--kubelet-registration-path=/var/lib/kubelet/plugins/stripefs.csi.example.com/csi.sock"
            - "--v=2"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration

      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/stripefs.csi.example.com
            type: DirectoryOrCreate
        - name: pods-mount-dir
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: data-dir
          hostPath:
            path: /data
            type: DirectoryOrCreate
        - name: dev-fuse
          hostPath:
            path: /dev/fuse
